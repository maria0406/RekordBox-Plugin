; Phrase Countdown Light -- Seeed Studio XIAO ESP32C3 + 16 x WS2812B ring.
;
; The board definition (platform-espressif32 boards/seeed_xiao_esp32c3.json)
; already sets -DARDUINO_USB_MODE=1 and -DARDUINO_USB_CDC_ON_BOOT=1, so
; `Serial` is the chip's native USB port. They are repeated below so the
; project keeps working if a future board file drops them.

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.5
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
